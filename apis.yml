name: Tripplus
description: TripPlus (點數旅遊) is a Taiwan-based travel-rewards and loyalty-points platform.
  It provides airline mileage award-ticket search and redemption tools, curated recommendations
  and comparisons of US travel credit cards, and a marketplace for buying and selling airline
  miles and reward points. The consumer-facing site (tripplus.cc) is fronted by Cloudflare and,
  as of this enrichment pass, exposes no public developer API, OpenAPI specification, SDKs, or
  documented well-known endpoints. Backed by 500 Global; tracked in the API Evangelist network
  as a portfolio lead.
